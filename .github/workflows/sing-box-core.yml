name: Build sing-box with V2Ray API

on:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: Full SagerNet/sing-box commit SHA (review before building)
        required: true
        default: b5ebaa1fc0f2b94256180b95468e73ef53caa27d
      upstream_version:
        description: Version of that commit, without the v prefix
        required: true
      go_version:
        description: Go version used by the matching upstream release workflow
        required: true
        default: '1.25.12'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
      UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: |
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ inputs.upstream_commit }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: false
      - name: Prepare upstream musl Chromium toolchain
        working-directory: upstream
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          cronet_ref=$(cat .github/CRONET_GO_VERSION)
          git init "$RUNNER_TEMP/cronet-go"
          git -C "$RUNNER_TEMP/cronet-go" remote add origin https://github.com/SagerNet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go" sparse-checkout set --no-cone '/*' '!/lib'
          git -C "$RUNNER_TEMP/cronet-go" fetch --depth=1 --filter=blob:none origin "$cronet_ref"
          git -C "$RUNNER_TEMP/cronet-go" checkout FETCH_HEAD
          git -C "$RUNNER_TEMP/cronet-go" submodule update --init --recursive --depth=1
          cd "$RUNNER_TEMP/cronet-go"
          rm -f naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target="linux/$TARGET_ARCH" --libc=musl download-toolchain
          go run ./cmd/build-naive --target="linux/$TARGET_ARCH" --libc=musl env >> "$GITHUB_ENV"
      - name: Build full upstream feature set plus V2Ray API
        working-directory: upstream
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS),with_musl,with_v2ray_api"
          ldflags=$(cat release/LDFLAGS)
          mkdir -p dist
          go build -trimpath -o dist/sing-box -tags "$tags" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$UPSTREAM_VERSION $ldflags -s -w -buildid=" ./cmd/sing-box
          jq -n --arg arch "$TARGET_ARCH" --arg revision "$UPSTREAM_COMMIT" \
            --arg version "$UPSTREAM_VERSION" --arg tags "$tags" \
            --arg go "$(go version)" \
            '{arch:$arch, libc:"musl", revision:$revision, version:$version, tags:$tags, go:$go,
              source:("https://github.com/SagerNet/sing-box/tree/" + $revision)}' > dist/build.json
          cp LICENSE dist/LICENSE
          # Bundle the exact source tree alongside the binary for license compliance.
          git archive --format=tar.gz HEAD > dist/source.tar.gz
      - name: Verify static executable and V2Ray API configuration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          if readelf -l upstream/dist/sing-box | grep -q INTERP; then
            echo 'Expected a static musl executable' >&2
            exit 1
          fi
          runner=()
          if [[ "$TARGET_ARCH" == arm64 ]]; then runner=(qemu-aarch64); fi
          "${runner[@]}" upstream/dist/sing-box version | tee upstream/dist/version.txt
          grep -E '^Tags:.*with_v2ray_api' upstream/dist/version.txt
          printf '%s\n' '{"experimental":{"v2ray_api":{"listen":"127.0.0.1:10086","stats":{"enabled":true,"users":["smoke-test"]}}}}' > "$RUNNER_TEMP/stats.json"
          "${runner[@]}" upstream/dist/sing-box check -c "$RUNNER_TEMP/stats.json"
      - name: Package
        run: |
          tar -czf "sing-box-linux-${TARGET_ARCH}-musl.tar.gz" -C upstream/dist sing-box build.json LICENSE source.tar.gz version.txt
          sha256sum "sing-box-linux-${TARGET_ARCH}-musl.tar.gz" > "sing-box-linux-${TARGET_ARCH}-musl.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.arch }}
          path: sing-box-linux-*.tar.gz*

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          merge-multiple: true
          path: dist
      - name: Create draft (publish only after reviewing both artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ inputs.upstream_commit }}
          SOURCE_VERSION: ${{ inputs.upstream_version }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          tag="sing-box-v2ray-${SOURCE_VERSION}-${SOURCE_COMMIT:0:12}"
          printf 'SagerNet/sing-box %s (%s).\n\nFull upstream Linux tags + with_musl + with_v2ray_api.\nReview artifacts and Linux deployment before publishing this draft.\n' "$SOURCE_VERSION" "$SOURCE_COMMIT" > notes.md
          gh release create "$tag" dist/* --draft --target "$TARGET_COMMIT" --title "$tag" --notes-file notes.md
